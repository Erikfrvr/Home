<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Casa Aberta | Cadastro de Equipe</title>

    <link rel="stylesheet" href="cadastro.css">

    <!-- Fonte Google -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- ===================== -->
    <!-- CONTAINER -->
    <!-- ===================== -->

    <main class="container">

        <div class="card">

            <header>

                <h1>CASA ABERTA</h1>

                <p>Cadastro da Equipe</p>

            </header>

            <form id="formCadastro">

                <!-- Nome da Equipe -->

                <div class="grupo">

                    <label for="nomeEquipe">

                        Nome da Equipe

                    </label>

                    <input
                        type="text"
                        id="nomeEquipe"
                        placeholder="Digite o nome da equipe"
                        required>

                </div>

                <!-- Jogador 1 -->

                <div class="grupo">

                    <label for="jogador1">

                        Jogador 1

                    </label>

                    <input
                        type="text"
                        id="jogador1"
                        placeholder="Nome do jogador"
                        required>

                </div>

                <!-- Jogador 2 -->

                <div class="grupo">

                    <label for="jogador2">

                        Jogador 2

                    </label>

                    <input
                        type="text"
                        id="jogador2"
                        placeholder="Nome do jogador"
                        required>

                </div>

                <!-- Jogador 3 -->

                <div class="grupo">

                    <label for="jogador3">

                        Jogador 3

                    </label>

                    <input
                        type="text"
                        id="jogador3"
                        placeholder="Nome do jogador"
                        required>

                </div>

                <!-- Jogador 4 -->

                <div class="grupo">

                    <label for="jogador4">

                        Jogador 4

                    </label>

                    <input
                        type="text"
                        id="jogador4"
                        placeholder="Nome do jogador"
                        required>

                </div>

                <!-- ID -->

                <div class="grupo">

                    <label for="idEquipe"></label>

                </div>

                <!-- Botões -->

                <div class="botoes">

                    <button
                    type="button"
                    id="btnVoltar"
                    class="pixel-btn pixel-btn-blue">

                    Voltar

                    </button>

                    <button
                    type="submit"
                     class="pixel-btn pixel-btn-orange">

                    Iniciar Jogo

                    </button>

                </div>

            </form>

        </div>

    </main>

    <script src="cadastro.js"></script>

</body>

</html>
