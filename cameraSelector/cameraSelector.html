<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Motion Verse | Selecionar Webcams</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../cadastro/cadastro.css">
    <link rel="stylesheet" href="cameraSelector.css">

</head>

<body>

    <!-- Fundo igual ao Cadastro -->

    <div class="bg-video" id="bgVideo">

        <video
            id="heroVideo"
            autoplay
            muted
            loop
            playsinline
            poster="../assets/video/floresta-poster.jpg">

            <source src="../assets/video/floresta-loop.mp4" type="video/mp4">

        </video>

        <div
            class="bg-fireflies"
            id="fireflies"
            aria-hidden="true">

        </div>

        <div class="bg-overlay"></div>

    </div>

    <!-- Conteúdo -->

    <main class="container">

        <div class="card">

            <header>

                <h1>Motion Verse</h1>

                <p>Selecionar Webcams</p>

                <h2 id="nomeEquipe"></h2>

            </header>

            <!-- Jogador 1 -->

            <div class="cardJogador">

                <h3>Jogador 1 - Frente</h3>

                <p id="nomeJogador1"></p>

                <select id="camera1"></select>

            </div>

            <!-- Jogador 2 -->

            <div class="cardJogador">

                <h3>Jogador 2 - Trás</h3>

                <p id="nomeJogador2"></p>

                <select id="camera2"></select>

            </div>

            <!-- Jogador 3 -->

            <div class="cardJogador">

                <h3>Jogador 3 - Baixo</h3>

                <p id="nomeJogador3"></p>

                <select id="camera3"></select>

            </div>

            <!-- Jogador 4 -->

            <div class="cardJogador">

                <h3>Jogador 4 - Cima</h3>

                <p id="nomeJogador4"></p>

                <select id="camera4"></select>

            </div>

            <!-- Botões -->

            <div class="botoes">

                <button
                    id="btnVoltar"
                    class="pixel-btn pixel-btn-blue">

                    Voltar

                </button>

                <button
                    id="btnIniciar"
                    class="pixel-btn pixel-btn-orange">

                    Iniciar Jogo

                </button>

            </div>

        </div>

    </main>

    <!-- Modal Confirmar -->

<div id="modalConfirmacao" class="modal">

    <div class="modal-conteudo">

        <h2>Confirmar</h2>

        <p>

            Deseja iniciar o jogo com essas webcams?

        </p>

        <div class="modal-botoes">

            <button
                id="btnCancelarModal"
                class="pixel-btn pixel-btn-blue">

                Cancelar

            </button>

            <button
                id="btnConfirmarModal"
                class="pixel-btn pixel-btn-orange">

                Iniciar

            </button>

        </div>

    </div>

</div>


<!-- Modal Erro -->

<div id="modalErro" class="modal">

    <div class="modal-conteudo">

        <h2>Atenção</h2>

        <p id="mensagemErro"></p>

        <div class="modal-botoes">

            <button
                id="btnFecharErro"
                class="pixel-btn pixel-btn-orange">

                OK

            </button>

        </div>

    </div>

</div>

    <script type="module" src="cameraSelector.js"></script>

</body>

</html>
