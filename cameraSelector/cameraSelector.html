<!DOCTYPE html>
<html lang="pt-BR">


<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cameraSelector.css">
    <link rel="stylesheet" href="style.css">

    <title>Selecionar Câmeras</title>

    


</head>

<body>

    <div class="bg-video">

        <video autoplay muted loop playsinline>
            <source
                src="assets/video/floresta-loop.mp4"
                type="video/mp4">
        </video>

        <div class="bg-fireflies"></div>

        <div class="bg-overlay"></div>

    </div>


    <main class="container">

        <h1>Selecionar Webcams</h1>

        <h2 id="nomeEquipe"></h2>


        

        <div class="cardJogador">

            <h3>Jogador 1 - Frente</h3>

            <p id="nomeJogador1"></p>

            <select id="camera1"></select>

        </div>


        

        <div class="cardJogador">

            <h3>Jogador 2 - Trás</h3>

            <p id="nomeJogador2"></p>

            <select id="camera2"></select>

        </div>


        

        <div class="cardJogador">

            <h3>Jogador 3 - Baixo</h3>

            <p id="nomeJogador3"></p>

            <select id="camera3"></select>

        </div>


        

        <div class="cardJogador">

            <h3>Jogador 4 - Cima</h3>

            <p id="nomeJogador4"></p>

            <select id="camera4"></select>

        </div>


        

        <div class="botoes">

            <button
                id="btnVoltar"
                type="button">

                Voltar

            </button>


            <button
                id="btnIniciar"
                type="button">

                Iniciar Jogo

            </button>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Motion<span class="foot-accent">Verse</span>
        </p>

        <p>
            Projeto desenvolvido no Senac
        </p>

    </footer>

</body>
</html>
